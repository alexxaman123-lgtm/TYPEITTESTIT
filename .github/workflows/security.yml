name: Security checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: true
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # The eslint toolchain is installed with --no-save so package-lock.json
        # stays untouched (it cannot be regenerated through this automation).
        # Pinned versions must stay in sync with eslint.config.js.
        run: |
          npm install --no-save --no-audit eslint@9.39.5 @eslint/js@9.39.5 typescript-eslint@8.71.2 eslint-plugin-react@7.37.5 eslint-plugin-react-hooks@7.1.1 eslint-plugin-astro@1.7.0 globals@17.13.0
          npm run lint

      - name: Static security checks
        run: npm run security:static

      - name: Build
        run: npm run build
